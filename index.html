    <!-- Order Success 3D Background (applied via JS when order-success route is active) -->
    <script>
    (function(){
      // Add 3D background to order success when it appears
      var observer = new MutationObserver(function(mutations){
        mutations.forEach(function(mutation){
          mutation.addedNodes.forEach(function(node){
            if(node.nodeType === 1 && node.textContent && node.textContent.includes('Order Placed Successfully')){
              // Find the order success container and enhance it
              var container = node.closest ? node.closest('main') || node : node;
              if(container && container.style){
                container.style.background = 'linear-gradient(135deg, #0f0a1a 0%, #1a0a2e 25%, #0d1b2a 50%, #1a0a2e 75%, #0f0a1a 100%)';
                container.style.position = 'relative';
                container.style.overflow = 'hidden';
                // Add 3D overlay layers
                var overlay1 = document.createElement('div');
                overlay1.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 20% 50%, rgba(236,72,153,0.12) 0%, transparent 60%), radial-gradient(ellipse at 80% 50%, rgba(59,130,246,0.12) 0%, transparent 60%);pointer-events:none;z-index:0;';
                container.insertBefore(overlay1, container.firstChild);
                var overlay2 = document.createElement('div');
                overlay2.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(45deg, transparent 30%, rgba(236,72,153,0.03) 50%, transparent 70%);pointer-events:none;z-index:0;animation:float3d 8s ease-in-out infinite;';
                container.insertBefore(overlay2, container.firstChild);
              }
            }
          });
        });
      });
      observer.observe(document.getElementById('root'), {childList:true, subtree:true});
    })();
