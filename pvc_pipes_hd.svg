<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- CPVC Pipe Cream Gradient -->
    <linearGradient id="pipeCream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="90%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- PVC Pipe Sky Blue Gradient -->
    <linearGradient id="pipeBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Brass Thread Metal Gradient -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Red Stripe Gradient -->
    <linearGradient id="redStripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    
    <!-- Subtle Inner Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="1000" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle Studio Floor Grid Light -->
  <ellipse cx="500" cy="480" rx="420" ry="80" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>

  <!-- Pipe Group with 3D Depth Shadow -->
  <g filter="url(#shadow)">
    
    <!-- Back PVC Blue Pipe (Large Diameter 2 inch) -->
    <g transform="translate(140, 260) rotate(-12)">
      <!-- Main Cylinder -->
      <rect x="0" y="0" width="720" height="70" rx="8" fill="url(#pipeBlue)"/>
      <!-- Pipe Socket Ring Left -->
      <rect x="0" y="-4" width="45" height="78" rx="6" fill="url(#pipeBlue)"/>
      <line x1="45" y1="-4" x2="45" y2="74" stroke="#0284c7" stroke-width="3"/>
      <!-- Blue Pipe Label -->
      <text x="250" y="42" font-family="sans-serif" font-weight="900" font-size="18" fill="#ffffff" opacity="0.85" letter-spacing="3">SUPREME HIGH PRESSURE PVC-U • 110mm • CLASS 3</text>
    </g>

    <!-- Main CPVC Premium Cream Pipe (Front 1 inch SDR 11) -->
    <g transform="translate(100, 310) rotate(-6)">
      <!-- Pipe Body -->
      <rect x="0" y="0" width="780" height="52" rx="6" fill="url(#pipeCream)"/>
      
      <!-- Red Hot Water Line -->
      <rect x="0" y="22" width="780" height="7" fill="url(#redStripe)"/>
      
      <!-- Socket End Left -->
      <rect x="-5" y="-3" width="38" height="58" rx="5" fill="url(#pipeCream)"/>
      <rect x="33" y="-3" width="6" height="58" fill="#cbd5e1"/>
      
      <!-- Text Print on Pipe -->
      <text x="200" y="17" font-family="sans-serif" font-weight="800" font-size="13" fill="#1e293b" opacity="0.9" letter-spacing="2">SUPREME CPVC HEAVY DUTY SDR 11 • HOT &amp; COLD WATER • LEAD FREE</text>
    </g>

    <!-- 3D Brass Female Threaded Elbow Fitting (Left Foreground) -->
    <g transform="translate(220, 210)">
      <!-- Outer Elbow Curve -->
      <path d="M 0,0 L 90,0 C 130,0 150,20 150,60 L 150,130 L 90,130 L 90,60 C 90,50 80,40 70,40 L 0,40 Z" fill="url(#pipeCream)"/>
      <!-- Brass Insert Collar -->
      <rect x="-10" y="-8" width="30" height="56" rx="4" fill="url(#brassGrad)"/>
      <rect x="20" y="-8" width="6" height="56" fill="#78350f"/>
      <!-- Thread Grooves inside -->
      <line x1="-5" y1="4" x2="15" y2="4" stroke="#451a03" stroke-width="2"/>
      <line x1="-5" y1="14" x2="15" y2="14" stroke="#451a03" stroke-width="2"/>
      <line x1="-5" y1="24" x2="15" y2="24" stroke="#451a03" stroke-width="2"/>
      <line x1="-5" y1="34" x2="15" y2="34" stroke="#451a03" stroke-width="2"/>
    </g>

    <!-- 3D Equal Tee Fitting (Right Foreground) -->
    <g transform="translate(620, 240)">
      <!-- Main Horizontal Body -->
      <rect x="0" y="20" width="130" height="50" rx="6" fill="url(#pipeCream)"/>
      <!-- Vertical Branch -->
      <rect x="40" y="-40" width="50" height="70" rx="6" fill="url(#pipeCream)"/>
      <!-- Reinforced Rings -->
      <rect x="-4" y="16" width="18" height="58" rx="3" fill="url(#pipeCream)"/>
      <rect x="116" y="16" width="18" height="58" rx="3" fill="url(#pipeCream)"/>
      <rect x="36" y="-44" width="58" height="18" rx="3" fill="url(#pipeCream)"/>
    </g>

  </g>

  <!-- Product Badges & Lighting Highlights -->
  <!-- Brand Badge Top Left -->
  <g transform="translate(60, 50)">
    <rect width="210" height="42" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <text x="15" y="26" font-family="sans-serif" font-weight="900" font-size="14" fill="#38bdf8" letter-spacing="1">SUPREME PIPES</text>
    <text x="145" y="26" font-family="sans-serif" font-weight="800" font-size="10" fill="#34d399">ORIGINAL</text>
  </g>

  <!-- Spec Tag Top Right -->
  <g transform="translate(730, 50)">
    <rect width="210" height="42" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" opacity="0.9"/>
    <text x="20" y="26" font-family="sans-serif" font-weight="900" font-size="13" fill="#ffffff" letter-spacing="1">CPVC &amp; UPVC PIPES</text>
  </g>

  <!-- Bottom Quality Seal -->
  <g transform="translate(60, 500)">
    <rect width="320" height="46" rx="14" fill="#0284c7" opacity="0.95"/>
    <text x="20" y="28" font-family="sans-serif" font-weight="900" font-size="13" fill="#ffffff" letter-spacing="1">100% LEAD FREE • SDR 11 HEAVY DUTY</text>
  </g>

</svg>
